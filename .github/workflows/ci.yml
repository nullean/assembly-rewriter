name: ci

# nuget.org's trusted publishing policies name this file, so releasing happens here too: publishing the
# release-drafter draft (web UI or phone) creates the tag and fires `release: published`, and the build job below
# pushes the packages and the container image for it. Pushing a tag on its own releases nothing.
on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # On pull requests, only linux-x64 runs, to prove AOT still links without burning the full matrix
  # on packages nobody sees. All five run on push and release, where the packages are actually uploaded.
  aot-pack:
    runs-on: ${{ matrix.runner }}
    name: AOT pack (${{ matrix.rid }})
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request'
          && '[{"rid":"linux-x64","runner":"ubuntu-latest"}]'
          || '[{"rid":"linux-x64","runner":"ubuntu-latest"},{"rid":"linux-arm64","runner":"ubuntu-24.04-arm"},{"rid":"win-x64","runner":"windows-latest"},{"rid":"win-arm64","runner":"windows-11-arm"},{"rid":"osx-arm64","runner":"macos-latest"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # MinVer computes the version from tag history
          persist-credentials: false

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: false # this workflow publishes what it builds; never restore a cache a PR could have written
        env:
          MISE_JOBS: "1" # dotnet versions share one DOTNET_ROOT; installing them in parallel races

      - name: Pack native-AOT tool for ${{ matrix.rid }}
        shell: bash
        env:
          RID: ${{ matrix.rid }}
        run: dotnet pack src/assembly-rewriter/assembly-rewriter.csproj -c Release -r "$RID" -o build/output

      # Container image, linux-x64 only for now — the platform every GitHub-hosted Linux runner
      # already matches. No --push here and no registry login on this leg, so this only proves the
      # container build itself still works: AOT compiles, the chiseled base image resolves, and the
      # SDK's container tooling produces an image in the local Docker daemon. The real push to
      # ghcr.io happens once, in the build job below, which does pass --push.
      - name: Build container image (no push)
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: dotnet run --project build/scripts -- publishcontainers -s true

      - name: Report container image size
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: docker images nullean/assembly-rewriter --format '{{.Tag}}\t{{.Size}}'

      - name: Upload per-RID package
        if: github.event_name == 'push' || github.event_name == 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nupkg-${{ matrix.rid }}
          path: build/output/*.nupkg
          if-no-files-found: error

  zizmor:
    uses: nullean/.github/.github/workflows/zizmor.yml@83ef343759c443afe1964e9c33327527f8677b05 # v1.3.0
    permissions:
      contents: read

  build:
    runs-on: ubuntu-latest
    needs: [aot-pack, zizmor]
    timeout-minutes: 30
    permissions:
      contents: write   # append the public API changes to the release notes
      packages: write   # push to GitHub Packages and ghcr.io
      id-token: write   # NuGet trusted publishing: exchange the workflow's OIDC token for a short-lived key
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0 # MinVer computes the version from tag history
        persist-credentials: false

    - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      with:
        cache: false # a release never restores a cache PR builds could have written
      env:
        MISE_JOBS: "1" # dotnet versions share one DOTNET_ROOT; installing them in parallel races

    - name: Build, pack the root and portable packages, validate them, report public API changes
      run: mise run ci

    - name: Download per-RID AOT packages
      if: github.event_name == 'push' || github.event_name == 'release'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: nupkg-*
        path: build/output
        merge-multiple: true

    - name: publish to github package repository
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
      shell: bash
      timeout-minutes: 10
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        until dotnet nuget push 'build/output/*.nupkg' -k "$GITHUB_TOKEN" \
          -s https://nuget.pkg.github.com/nullean/index.json --skip-duplicate --no-symbols; do
          echo "Retrying"; sleep 1
        done

    # ghcr.io/nullean/assembly-rewriter, matching curb's own tagging: "edge" on every push, plus
    # "latest" and the semver when building an exact release tag — see
    # publishContainers/containerImageTags in Targets.fs for how that split is decided.
    - name: Log in to ghcr.io
      if: github.event_name == 'push' || github.event_name == 'release'
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Publish container image
      if: github.event_name == 'push' || github.event_name == 'release'
      run: dotnet run --project build/scripts -- publishcontainers -s true --push

    - name: Check the packages carry the release version
      if: github.event_name == 'release'
      shell: bash
      env:
        TAG: ${{ github.event.release.tag_name }}
      run: |
        shopt -s nullglob
        packages=(build/output/*.nupkg)
        if [ ${#packages[@]} -ne 7 ]; then
          echo "::error::expected the root, any and five per-RID packages, found ${#packages[@]}"
          exit 1
        fi
        for p in "${packages[@]}"; do
          case "$(basename "$p")" in
            *."$TAG".nupkg) ;;
            *) echo "::error::$(basename "$p") is not version $TAG"; exit 1 ;;
          esac
        done

    # Trusted publishing: nuget.org trusts this repository's ci.yml (a policy owned by the nullean
    # organization), so there is no long-lived API key to expire. The key it returns lasts an hour, so the
    # login sits right before the push. NUGET_USER is the nuget.org profile name, set at the org level.
    - name: Log in to nuget.org (trusted publishing)
      id: nuget-login
      if: github.event_name == 'release'
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: release to nuget.org
      if: github.event_name == 'release'
      shell: bash
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      run: |
        dotnet nuget push 'build/output/*.nupkg' -k "$NUGET_API_KEY" \
          -s https://api.nuget.org/v3/index.json --skip-duplicate --no-symbols

    # After the push, so the notes gain the API changes only once the packages are out. The notes themselves are the
    # draft release-drafter kept from the merged pull requests; a re-run appends nothing twice.
    - name: Append the public API changes to the release notes
      if: github.event_name == 'release'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.event.release.tag_name }}
      run: |
        file=build/output/github-breaking-changes-comments.md
        if [ ! -s "$file" ]; then
          echo "no public API changes to add"
          exit 0
        fi
        notes=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
        marker="<!-- public-api-changes -->"
        case "$notes" in *"$marker"*) echo "already appended"; exit 0 ;; esac
        {
          printf '%s\n\n%s\n\n' "$notes" "$marker"
          cat "$file"
        } > "$RUNNER_TEMP/notes.md"
        gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
